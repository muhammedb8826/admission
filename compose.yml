name: admission
services:
  frontend:
    build:
      context: .
      secrets:
        - strapi_env
      args:
        NEXT_PUBLIC_API_BASE_URL: https://admission-api.dadu.edu.et
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: https://admission-api.dadu.edu.et
    ports:
      - "127.0.0.1:3021:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

secrets:
  strapi_env:
    file: .env
