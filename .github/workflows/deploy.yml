name: Deploy admission frontend
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admission-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
          STRAPI_API_TOKEN: ${{ secrets.STRAPI_API_TOKEN }}
        with:
          host: ${{ secrets.HOST || '196.190.251.30' }}
          username: ${{ secrets.USERNAME || 'daduvm01' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '443' }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          command_timeout: 40m
          envs: DEPLOY_SHA,STRAPI_API_TOKEN
          script: |
            set -eu
            cd /var/www/admission
            git diff --quiet && git diff --cached --quiet
            git fetch origin main
            git checkout --detach "$DEPLOY_SHA"
            umask 077
            touch .env
            if [ -n "${STRAPI_API_TOKEN:-}" ]; then
              sed -i '/^STRAPI_API_TOKEN=/d' .env
              printf 'STRAPI_API_TOKEN=%s\n' "$STRAPI_API_TOKEN" >> .env
            fi
            docker compose config -q
            docker compose up -d --build --wait --wait-timeout 180
            curl --fail --silent --show-error http://127.0.0.1:3021/api/health
